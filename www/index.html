/* ===== PROFILE REDESIGN (looks only) : centered layout, mesh cover, gradient avatar ring, pill tabs, card sections ===== */
:root{--pg:#eef0f6;--cd:#ffffff;--cd2:#f1f3f8;--pgrad:linear-gradient(135deg,var(--accent, #7c3aed),var(--accent-deep, #4f46e5))}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#000;--cd:#131416;--cd2:#1d1f22}}
:is(#list,#feedc)[data-t="menu"],#pfv,.pfw{background:var(--pg)}
.pfb{height:56px;padding:0 12px;gap:10px;background:var(--pg);background:color-mix(in srgb,var(--pg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:0}

.pcv::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.28));pointer-events:none}

const profileDateLabel = value => {
  if (!value) return "Not available";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "Not available";
  return d.toLocaleDateString(undefined, {month: "long", day: "numeric", year: "numeric"});
};
const profileRelativeLabel = value => {
  if (!value) return "Not available";
  const d = new Date(value), ms = Date.now() - d.getTime();
  if (Number.isNaN(d.getTime()) || ms < 0) return "Not available";
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + (days === 1 ? " day ago" : " days ago");
  return profileDateLabel(value);
};

// ---------- RINGING RECORD (call_ring.sql): show the incoming-call bar even if the app was closed when the call started ----------
const ringDone = {};

    if (c) { ringIn.conf = true; saveRing(Math.max(2000, 44000 - c.age_ms)); } } catch (e) {}
}

  try {
    const o = JSON.parse(localStorage.getItem("ringIn") || "null"); if (!o || !me || call || ringIn) return;
    const left = o.until - Date.now(); if (left < 2500) return localStorage.removeItem("ringIn");

const cancelRing = r => { (members[r.id] || []).filter(u => u !== me.id).forEach(u => sendInbox(u, "cancel", {room: r.id, from: me.id})); sb.rpc("end_call_ring", {rid: r.id}).then(() => {}, () => {}); };

// start / join
async function startCall(video) {

// call log messages are normal chat messages with a special body, e.g. [[call:missed:audio]] or [[call:ended:video:151]]
const callLog = b => {

};

const sig = (p, to) => { if (call && call.ch) call.ch.send({type: "broadcast", event: "sig", payload: {...p, from: me.id, to}}); };

async function onSig(p) {
  if (!call || !p || p.from === me.id || (p.to && p.to !== me.id)) return;
  const id = p.from; if (!(members[call.room] || []).includes(id)) return;
  try {
    if (p.t === "join") { dropPeer(id, true); sig({t: "hello", cam: call.cam}, id); meet(id, p.cam); }
    else if (p.t === "hello") meet(id, p.cam);
    else if (p.t === "offer") {
      const P = call.peers[id] || meet(id);
      await P.pc.setRemoteDescription(p.sdp); await flushIce(P);
      const a = await P.pc.createAnswer(); await P.pc.setLocalDescription(a);
      sig({t: "answer", sdp: P.pc.localDescription}, id);
    } else if (p.t === "answer") {
      const P = call.peers[id];
      if (P && P.pc.signalingState === "have-local-offer") { await P.pc.setRemoteDescription(p.sdp); await flushIce(P); }
    } else if (p.t === "ice") {

function meet(id, cam) {
  const old = call.peers[id]; if (old) { if (cam != null) setCam(old, cam); return old; }
  const pc = new RTCPeerConnection(ICE), P = {pc, q: [], cam: cam != null ? !!cam : call.video, tile: null, vid: null, ms: null};
  call.peers[id] = P;

  pc.onicecandidate = e => { if (e.candidate) sig({t: "ice", c: e.candidate.toJSON()}, id); };
  pc.ontrack = e => { if (!P.ms) { P.ms = new MediaStream(); P.vid.srcObject = P.ms; } P.ms.addTrack(e.track); };

    if (!call || call.peers[id] !== P) return;
    if (pc.connectionState === "connected") connected(); else if (pc.connectionState === "failed") dropPeer(id);
  };
  const nm = names[id] || "Someone", t = el("div", "tile" + (P.cam ? "" : " nocam")), v = document.createElement("video");
  v.autoplay = true; v.setAttribute("playsinline", ""); P.vid = v; P.tile = t;
  t.append(v, avatar(id, nm[0].toUpperCase()), el("div", "nm2", nm)); $("#grid").append(t);
  if (me.id < id) makeOffer(id, P);   // lower id offers, so two sides never offer at once
  updateStatus();

}
async function makeOffer(id, P) {
  try { const o = await P.pc.createOffer(); await P.pc.setLocalDescription(o); sig({t: "offer", sdp: P.pc.localDescription}, id); } catch (e) {}
}
function dropPeer(id, quiet) {
  const P = call && call.peers[id]; if (!P) return;
  delete call.peers[id];
  try { P.pc.close(); } catch (e) {}
  P.tile.remove(); updateStatus();

}
function connected() {
  if (!call) return;
  if (!call.everConnected) { call.everConnected = true; call.start = Date.now(); clearTimeout(call.wait); call.timer = setInterval(updateStatus, 1000); }
  updateStatus();
}
function updateStatus() {
  if (!call) return;
  const n = Object.keys(call.peers).length;
  $("#cstat").textContent = call.everConnected ? fmtDur(Date.now() - call.start) + (n > 1 ? " · " + (n + 1) + " people" : "") : (call.caller ? "Calling…" : "Connecting…");
}
function endCall(why) {
  const c = call; if (!c) return; call = null;
  clearInterval(c.timer); clearTimeout(c.wait);
  try { c.ch.send({type: "broadcast", event: "sig", payload: {t: "leave", from: me.id}}); } catch (e) {}
  if (c.caller) logCall(c);
  if (c.caller && !c.everConnected) (members[c.room] || []).filter(u => u !== me.id).forEach(u => sendInbox(u, "cancel", {room: c.room, from: me.id}));
  if (c.caller) sb.rpc("end_call_ring", {rid: c.room}).then(() => {}, () => {});
  Object.values(c.peers).forEach(P => { try { P.pc.close(); } catch (e) {} });

  setTimeout(() => sb.removeChannel(c.ch), 500);
  $("#grid").replaceChildren(); $("#selfv").srcObject = null; $("#call").classList.add("hide"); document.documentElement.classList.remove("incall");
  if (why) toast(why);
}
