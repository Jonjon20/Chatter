function chatterBase64UrlBytes(base64url) {
  const pad = "=".repeat((4 - base64url.length % 4) % 4);
  const raw = atob((base64url + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function enableChatterPush() {
  const say = (msg) => alert(msg);
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return say('Push notifications are not supported by this browser.');
  if (!/^https:/.test(location.protocol) && location.hostname !== 'localhost') return say('Push notifications require HTTPS.');
  if (!CHATTER_VAPID_PUBLIC_KEY || CHATTER_VAPID_PUBLIC_KEY.startsWith('REPLACE_')) return say('Configure CHATTER_VAPID_PUBLIC_KEY in index.html with your VAPID public key first. Keep the private key on the server only.');
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return say('Notification permission was not granted.');
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chatterBase64UrlBytes(CHATTER_VAPID_PUBLIC_KEY) });
    const j = sub.toJSON();
    const { error } = await sb.from('chatter_push_subscriptions').upsert({ user_id: me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, updated_at: new Date().toISOString() }, { onConflict: 'endpoint' });
    if (error) throw error;
    await saveS('n_push', true);
    say('Push notifications enabled for this browser. Delivery also requires the Supabase Edge Function and webhook setup in SETUP.md.');
  } catch (e) { say('Could not enable push notifications: ' + (e.message || e) + '\n\nRun the SQL migration and deploy the service worker first.'); }
}
async function disableChatterPush() {
  try {
    const reg = await navigator.serviceWorker.getRegistration('/');
    const sub = reg && await reg.pushManager.getSubscription();
    if (sub) {
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      await sb.from('chatter_push_subscriptions').delete().eq('user_id', me.id).eq('endpoint', endpoint);
    }
    await saveS('n_push', false);
    alert('Push notifications disabled for this browser.');
  } catch (e) { alert('Could not disable push notifications: ' + (e.message || e)); }
}

    bx.style.cssText = "background:var(--bg);color:var(--tx);border-radius:14px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px";

async function deleteAccount() {
  if (deleting || !me) return;
  if (!me.email) return alert("This account has no email, so the password can't be verified.");
  if (!(await askPassword())) return;
  deleting = true;
  try {
    // 1) remove stored images (files in Storage are NOT removed by SQL deletes)
    const paths = new Set();
    const {data: mine} = await sb.storage.from("chat-images").list(me.id, {limit: 1000});
    (mine || []).forEach(f => f.name && paths.add(me.id + "/" + f.name));
    const dmIds = rooms.filter(r => r.is_dm).map(r => r.id);
    if (dmIds.length) {
      const {data: im} = await sb.from("messages").select("image_path").in("room_id", dmIds).not("image_path", "is", null);
      (im || []).forEach(x => x.image_path && paths.add(x.image_path));
    }
    const list = [...paths];
    for (let i = 0; i < list.length; i += 100) await sb.storage.from("chat-images").remove(list.slice(i, i + 100));
    // 2) delete rows + auth user (server-side function, see delete_account.sql)
    const {error} = await sb.rpc("delete_my_account");
    if (error) throw error;
    try { localStorage.clear(); } catch (e) {}
    await sb.auth.signOut().catch(() => {});
    alert("Your account has been deleted.");
  } catch (err) {
    alert("Couldn't delete account: " + (err.message || err));
  }
  deleting = false;
}

  const r = rooms.find(x => x.id === p.room), mm = members[p.room] || [];
  if (!callable(r) || !mm.includes(p.from) || !mm.includes(me.id)) return;
  if (call && call.room === p.room) return;
  if (ringIn && ringIn.room === p.room && ringIn.from === p.from) return;
  if (call || ringIn) return sendInbox(p.from, "decline", {room: p.room, from: me.id, busy: true});
  const kind = p.video ? "video" : "voice", paint = () => {
    const who = names[p.from] || "Someone";
    $("#rtxt").textContent = r.is_dm ? who : who + " · " + title(r);
    $("#rsub").textContent = "Incoming " + (r.is_dm ? "" : "group ") + kind + " call";
  };
  ringIn = {room: p.room, from: p.from, video: !!p.video};
  paint(); $("#ring").classList.remove("hide"); ringStart();
  ringIn.timer = setTimeout(dismissRing, 45000); saveRing(45000); setTimeout(confirmRing, 1500);
  if (!names[p.from]) ensureNames([p.from]).then(() => { if (ringIn && ringIn.from === p.from) paint(); });
}
$("#ryes").onclick = () => { const p = ringIn; if (!p) return; dismissRing(); joinCall(p.room, p.video); };
$("#rno").onclick = () => { const p = ringIn; if (!p) return; dismissRing(); sendInbox(p.from, "decline", {room: p.room, from: me.id}); };

// ---------- RINGING RECORD (call_ring.sql): show the incoming-call bar even if the app was closed when the call started ----------
const ringDone = {};
let ringChecking = false;
const saveRing = ms => { try { if (ringIn) { ringIn.until = Date.now() + ms; localStorage.setItem("ringIn", JSON.stringify({room: ringIn.room, from: ringIn.from, video: ringIn.video, until: ringIn.until, conf: !!ringIn.conf})); } } catch (e) {} };
async function confirmRing() {
  if (!ringIn || ringIn.restored || ringIn.conf) return;
  try { const {data} = await sb.rpc("incoming_calls"), c = Array.isArray(data) && ringIn && data.find(x => x.room_id === ringIn.room && x.caller_id === ringIn.from);
    if (c) { ringIn.conf = true; saveRing(Math.max(2000, 44000 - c.age_ms)); } } catch (e) {}
}
async function restoreRing() {      // after a refresh: bring the bar back right away, then let the server confirm it
  try {
    const o = JSON.parse(localStorage.getItem("ringIn") || "null"); if (!o || !me || call || ringIn) return;
    const left = o.until - Date.now(); if (left < 2500) return localStorage.removeItem("ringIn");
    await onRing({room: o.room, from: o.from, video: o.video});
    if (ringIn && ringIn.room === o.room) { ringIn.restored = true; ringIn.conf = !!o.conf; ringIn.until = o.until; clearTimeout(ringIn.timer); ringIn.timer = setTimeout(dismissRing, left); }
  } catch (e) {}
}
async function checkRinging() {
  if (!me || call || ringChecking) return;
  if (ringIn && !ringIn.restored) return;
  ringChecking = true;
  try {
    const {data, error} = await sb.rpc("incoming_calls"); if (error || !Array.isArray(data)) { if (error) { console.warn("incoming_calls", error.message); if (!window.__ringErr) { window.__ringErr = 1; toast("Ring check failed: " + error.message); } } return; }
    if (ringIn && ringIn.restored) {      // the bar was restored from this device: keep it only if the caller is still ringing
      const c = data.find(x => x.room_id === ringIn.room && x.caller_id === ringIn.from);
      if (c && 44000 - c.age_ms >= 1500) { ringIn.restored = false; ringIn.conf = true; clearTimeout(ringIn.timer); ringIn.timer = setTimeout(dismissRing, 44000 - c.age_ms); saveRing(44000 - c.age_ms); }
      else if (c || ringIn.conf) dismissRing();          // the server listed this call before and now it is over
      else console.warn("the server has no record of this ring; keeping the bar until it times out");
      return;
    }
    for (const c of data) {
      const left = 44000 - c.age_ms, startedHere = Date.now() - c.age_ms, done = ringDone[c.room_id + "|" + c.caller_id];
      if (left < 2500 || (done && done > startedHere - 1000)) continue;     // almost over, or I already answered/declined it
      await onRing({room: c.room_id, from: c.caller_id, video: !!c.video});
      if (ringIn && ringIn.room === c.room_id) { clearTimeout(ringIn.timer); ringIn.timer = setTimeout(dismissRing, left); saveRing(left); }
      break;
    }
  } catch (e) {} finally { ringChecking = false; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkRinging(); });
addEventListener("focus", checkRinging); addEventListener("online", checkRinging);
const cancelRing = r => { (members[r.id] || []).filter(u => u !== me.id).forEach(u => sendInbox(u, "cancel", {room: r.id, from: me.id})); sb.rpc("end_call_ring", {rid: r.id}).then(() => {}, () => {}); };

// start / join
async function startCall(video) {
  sfx("conn");
  const r = rooms.find(x => x.id === cur);
  if (!callable(r) || call) return;
  if (r.is_dm && blocked.has(other(r))) return toast("Unblock this person first");
  sb.rpc("start_call_ring", {rid: r.id, video: !!video}).then(x => { if (x && x.error) toast("Ring record failed: " + x.error.message); }, () => {});
  sb.rpc("ring_push", {rid: r.id, video: !!video}).then(() => {}, () => {});
  (members[r.id] || []).filter(u => u !== me.id).forEach(u => sendInbox(u, "ring", {room: r.id, video: !!video, from: me.id}));
  beginCall(r, video, true);
}
async function joinCall(roomId, video) {
  const r = rooms.find(x => x.id === roomId);
  if (!callable(r) || call) return;
  beginCall(r, video, false);
}
async function beginCall(r, video, caller) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { if (caller) cancelRing(r); return alert("Calls need a secure (https) connection and a supported browser."); }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true, video: video ? {facingMode: "user", width: {ideal: r.is_dm ? 1280 : 640}, height: {ideal: r.is_dm ? 720 : 480}} : false});
  } catch (e) { if (caller) cancelRing(r); return alert("Couldn't access your " + (video ? "camera and microphone" : "microphone") + ". Check your browser permissions."); }
  if (call) { stream.getTracks().forEach(t => t.stop()); return; }
  call = {room: r.id, video, caller, dm: !!r.is_dm, stream, peers: {}, mic: true, cam: video, everConnected: false, start: 0, timer: null, ch: null, wait: null};
  $("#ctitle").textContent = title(r);
  $("#ccam").classList.toggle("hide", !video); $("#ccam").textContent = "🎥"; $("#ccam").classList.remove("off");
  $("#cmute").textContent = "🎤"; $("#cmute").classList.remove("off");
  $("#selfv").srcObject = stream; $("#self").classList.toggle("hide", !video);
  $("#grid").replaceChildren(); $("#call").classList.remove("hide"); updateStatus();
  call.wait = setTimeout(() => { if (call && !call.everConnected) endCall(call.caller ? "No answer" : "Couldn't connect"); }, caller ? 45000 : 30000);
  const ch = sb.channel("call:" + r.id); call.ch = ch;
  ch.on("broadcast", {event: "sig"}, ({payload}) => onSig(payload));
  ch.subscribe(s => {
    if (s !== "SUBSCRIBED" || !call || call.ch !== ch) return;
    sig({t: "join", cam: call.cam});
  });
}

// call log messages are normal chat messages with a special body, e.g. [[call:missed:audio]] or [[call:ended:video:151]]
const callLog = b => { const x = /^\[\[call:(missed|ended):(audio|video)(?::(\d+))?\]\]$/.exec(b || ""); return x ? {st: x[1], kind: x[2], sec: +x[3] || 0} : null; };
function callTexts(m, c) {
  const mine = m.user_id === me.id, K = c.kind === "video" ? "Video" : "Audio";
  if (c.st === "missed") return mine ? {t: K + " call", s: "No answer"} : {t: "Missed " + c.kind + " call", s: ""};
  return {t: K + " call ended", s: fmtDur(c.sec * 1000)};
}
function callPv(m) { const c = callLog(m.body); if (!c) return null; const x = callTexts(m, c); return (c.kind === "video" ? "🎥 " : "📞 ") + x.t + (x.s ? " · " + x.s : ""); }
function drawCall(bub, m, c) {
  const x = callTexts(m, c), mine = m.user_id === me.id;
  bub.replaceChildren(); bub.classList.remove("hide");
  const top = el("div", "clt"), ic = el("div", "cli", c.st === "missed" && !mine ? "📵" : c.kind === "video" ? "🎥" : "📞"), tx = el("div");
  tx.append(el("div", "t1", x.t), el("div", "t2", [x.s, fmt(m.created_at)].filter(Boolean).join(" · ")));
  top.append(ic, tx);
  const b = el("button", "gray", "Call again"); b.type = "button"; b.onclick = () => startCall(c.kind === "video");
  bub.append(top, b);
}
function logCall(c) {
  const kind = c.video ? "video" : "audio";
  const body = c.everConnected ? "[[call:ended:" + kind + ":" + Math.round((Date.now() - c.start) / 1000) + "]]" : "[[call:missed:" + kind + "]]";
  sb.from("messages").insert({room_id: c.room, body}).then(() => {});
}
const sig = (p, to) => { if (call && call.ch) call.ch.send({type: "broadcast", event: "sig", payload: {...p, from: me.id, to}}); };

async function onSig(p) {
  if (!call || !p || p.from === me.id || (p.to && p.to !== me.id)) return;
  const id = p.from; if (!(members[call.room] || []).includes(id)) return;
  try {
    if (p.t === "join") { dropPeer(id, true); sig({t: "hello", cam: call.cam}, id); meet(id, p.cam); }
    else if (p.t === "hello") meet(id, p.cam);
    else if (p.t === "offer") {
      const P = call.peers[id] || meet(id);
      await P.pc.setRemoteDescription(p.sdp); await flushIce(P);
      const a = await P.pc.createAnswer(); await P.pc.setLocalDescription(a);
      sig({t: "answer", sdp: P.pc.localDescription}, id);
    } else if (p.t === "answer") {
      const P = call.peers[id];
      if (P && P.pc.signalingState === "have-local-offer") { await P.pc.setRemoteDescription(p.sdp); await flushIce(P); }
    } else if (p.t === "ice") {
      const P = call.peers[id]; if (!P) return;
      if (P.pc.remoteDescription) await P.pc.addIceCandidate(p.c); else P.q.push(p.c);
    } else if (p.t === "state") { const P = call.peers[id]; if (P) setCam(P, p.cam); }
    else if (p.t === "leave") dropPeer(id);
  } catch (e) { console.warn("call signal error", e); }
}
async function flushIce(P) { while (P.q.length) { try { await P.pc.addIceCandidate(P.q.shift()); } catch (e) {} } }
function setCam(P, on) { P.cam = !!on; P.tile.classList.toggle("nocam", !P.cam); }

function meet(id, cam) {
  const old = call.peers[id]; if (old) { if (cam != null) setCam(old, cam); return old; }
  const pc = new RTCPeerConnection(ICE), P = {pc, q: [], cam: cam != null ? !!cam : call.video, tile: null, vid: null, ms: null};
  call.peers[id] = P;
  call.stream.getTracks().forEach(t => pc.addTrack(t, call.stream));
  pc.onicecandidate = e => { if (e.candidate) sig({t: "ice", c: e.candidate.toJSON()}, id); };
  pc.ontrack = e => { if (!P.ms) { P.ms = new MediaStream(); P.vid.srcObject = P.ms; } P.ms.addTrack(e.track); };
  pc.onconnectionstatechange = () => {
    if (!call || call.peers[id] !== P) return;
    if (pc.connectionState === "connected") connected(); else if (pc.connectionState === "failed") dropPeer(id);
  };
  const nm = names[id] || "Someone", t = el("div", "tile" + (P.cam ? "" : " nocam")), v = document.createElement("video");
  v.autoplay = true; v.setAttribute("playsinline", ""); P.vid = v; P.tile = t;
  t.append(v, avatar(id, nm[0].toUpperCase()), el("div", "nm2", nm)); $("#grid").append(t);
  if (me.id < id) makeOffer(id, P);   // lower id offers, so two sides never offer at once
  updateStatus();
  return P;
}
async function makeOffer(id, P) {
  try { const o = await P.pc.createOffer(); await P.pc.setLocalDescription(o); sig({t: "offer", sdp: P.pc.localDescription}, id); } catch (e) {}
}
function dropPeer(id, quiet) {
  const P = call && call.peers[id]; if (!P) return;
  delete call.peers[id];
  try { P.pc.close(); } catch (e) {}
  P.tile.remove(); updateStatus();
  if (!quiet && call.everConnected && !Object.keys(call.peers).length) endCall("Call ended");
}
function connected() {
  if (!call) return;
  if (!call.everConnected) { call.everConnected = true; call.start = Date.now(); clearTimeout(call.wait); call.timer = setInterval(updateStatus, 1000); }
  updateStatus();
}
function updateStatus() {
  if (!call) return;
  const n = Object.keys(call.peers).length;
  $("#cstat").textContent = call.everConnected ? fmtDur(Date.now() - call.start) + (n > 1 ? " · " + (n + 1) + " people" : "") : (call.caller ? "Calling…" : "Connecting…");
}
function endCall(why) {
  const c = call; if (!c) return; call = null;
  clearInterval(c.timer); clearTimeout(c.wait);
  try { c.ch.send({type: "broadcast", event: "sig", payload: {t: "leave", from: me.id}}); } catch (e) {}
  if (c.caller) logCall(c);
  if (c.caller && !c.everConnected) (members[c.room] || []).filter(u => u !== me.id).forEach(u => sendInbox(u, "cancel", {room: c.room, from: me.id}));
  if (c.caller) sb.rpc("end_call_ring", {rid: c.room}).then(() => {}, () => {});
  Object.values(c.peers).forEach(P => { try { P.pc.close(); } catch (e) {} });
  c.stream.getTracks().forEach(t => t.stop());
  setTimeout(() => sb.removeChannel(c.ch), 500);
  $("#grid").replaceChildren(); $("#selfv").srcObject = null; $("#call").classList.add("hide");
  if (why) toast(why);
}
$("#cmute").onclick = () => {
  if (!call) return; call.mic = !call.mic;
  call.stream.getAudioTracks().forEach(t => t.enabled = call.mic);
  $("#cmute").textContent = call.mic ? "🎤" : "🔇"; $("#cmute").classList.toggle("off", !call.mic);
};
$("#ccam").onclick = () => {
  if (!call || !call.video) return; call.cam = !call.cam;
  call.stream.getVideoTracks().forEach(t => t.enabled = call.cam);
  $("#ccam").textContent = call.cam ? "🎥" : "🚫"; $("#ccam").classList.toggle("off", !call.cam);
  $("#self").classList.toggle("hide", !call.cam); sig({t: "state", cam: call.cam});
};
$("#cend").onclick = () => endCall();
$("#vc").onclick = () => startCall(false);
$("#vd").onclick = () => startCall(true);
addEventListener("pagehide", () => { if (call) endCall(); });

const gdraft = {name: "", sel: new Set()};
async function createGroup() {
  const name = gdraft.name.trim();
  if (!name) return alert("Enter a group name.");
  if (!gdraft.sel.size) return alert("Pick at least one friend.");
  const {data, error} = await sb.rpc("create_group", {group_name: name, member_ids: [...gdraft.sel]});
  if (error) return alert(error.message);
  gdraft.name = ""; gdraft.sel = new Set();
  await loadChats(); setTab("chats"); openRoom(data);
}
$("#back").onclick = () => { $("#app").classList.remove("open"); cur = null; leaveTyping(); stopEdit(); updateHead(); render(); };
sb.auth.getSession().then(({data}) => { if (!data.session) showAuth(); });
</script>
