<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatter</title>
<style>
:root{--bg:#fff;--bg2:#f0f2f5;--tx:#050505;--mut:#65676b;--me:#0866ff;--metx:#fff;--oth:#e9ebee;--line:#e2e4e8;--dot:#0866ff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--bg2:#242526;--tx:#e4e6eb;--mut:#9a9da3;--oth:#303233;--line:#2a2b2c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hide{display:none!important}
input{border:0;background:var(--bg2);color:var(--tx);border-radius:20px;padding:10px 14px;font:inherit;outline:none;min-width:0}
button{border:0;background:var(--me);color:var(--metx);border-radius:20px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:none;color:var(--me)}button.gray{background:var(--bg2);color:var(--tx)}button.sm{padding:6px 14px;font-size:13px}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#auth form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#auth h1{margin:0 0 6px;text-align:center}#auth input{border:1px solid var(--line);background:var(--bg)}
#amsg{color:var(--mut);font-size:13px;text-align:center;min-height:18px}
.app{display:grid;grid-template-columns:380px 1fr;height:100%;padding-top:env(safe-area-inset-top,0px)}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.side h1{margin:0;padding:12px 16px 6px;font-size:26px;letter-spacing:-.5px}
.sw{padding:4px 16px 8px}.sw input{width:100%}
.chips{display:flex;gap:8px;padding:2px 16px 8px}
.chip{background:var(--bg2);color:var(--tx);padding:6px 14px;font-size:14px}.chip.on{background:#0866ff26;color:var(--me)}
#list{flex:1;overflow-y:auto}
.item{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}.item:active,.item.on{background:var(--bg2)}
.av{width:52px;height:52px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.av.sm{width:30px;height:30px;font-size:13px}
.mid{flex:1;min-width:0}.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .t1,.unread .t2{font-weight:700;color:var(--tx)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dot);flex:none}
.hint{color:var(--mut);padding:20px 16px;text-align:center}
.sec{font-size:13px;font-weight:700;color:var(--mut);padding:12px 16px 2px}
.tabs{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.tab{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 0 6px;font-size:11px;font-weight:600;position:relative}
.tab span{display:block;font-size:22px;line-height:1.1}.tab.on{color:var(--me)}
.bd{position:absolute;top:2px;left:55%;background:#f02849;color:#fff;border-radius:10px;font-size:11px;padding:0 5px;min-width:16px}
.menu{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.menu .row2{display:flex;gap:8px}.menu .row2 input{flex:1}
.main{display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.back{display:none;font-size:22px;padding:0 8px}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.col{display:flex;flex-direction:column;max-width:75%}.row.me .col{align-items:flex-end}
.nm{font-size:12px;color:var(--mut);margin:6px 0 2px 10px}
.bub{background:var(--oth);padding:8px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.row.me .bub{background:var(--me);color:var(--metx)}
.tm{font-size:11px;color:var(--mut);margin:1px 8px 4px}
.empty{margin:auto;color:var(--mut);text-align:center}
.compose{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}.compose input{flex:1}
.av{position:relative}.odot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#31a24c;border:2px solid var(--bg)}
.hd{min-width:0}.sub{font-size:12px;font-weight:400;color:var(--mut)}.sub.on{color:#31a24c}.sub:empty{display:none}
.more{background:none;color:var(--mut);padding:2px 8px;font-size:18px;line-height:1;align-self:center}
.acts{display:none;gap:6px;margin:2px 0 4px}.row.sel .acts{display:flex}
.pic img{display:block;width:auto;height:auto;max-width:min(100%,360px);max-height:320px;border-radius:16px;cursor:pointer;background:var(--bg2)}.pic img.ld{min-width:180px;min-height:140px}.pic{margin-bottom:2px}
.row .bub.gone,.row.me .bub.gone{background:none;border:1px dashed var(--line);color:var(--mut);font-style:italic}
.typing{height:18px;padding:0 18px;font-size:12px;color:var(--mut);font-style:italic}
.bar{display:flex;align-items:center;gap:10px;padding:6px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}.bar span{flex:1}.bar img{height:48px;border-radius:8px}
.att{padding:8px 12px;font-size:18px}
.pick{max-height:220px;overflow-y:auto}.pk{display:flex;align-items:center;gap:10px;padding:4px 0}.pk input{padding:0;width:18px;height:18px;accent-color:var(--me)}
#wiz{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#wiz h2{margin:6px 0 0;font-size:22px}#wiz p{margin:0;color:var(--mut);font-size:14px}
#wiz label.opt{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
#wiz label.opt input{width:20px;height:20px;padding:0;accent-color:var(--me)}
#wiz .otp{text-align:center;font-size:28px;letter-spacing:8px}
#wmsg{color:#f02849;font-size:13px;min-height:16px}#wback{align-self:flex-start;font-size:22px;padding:0 6px}
#wiz .small{font-size:13px;color:var(--mut)}
@media(max-width:700px){.app{grid-template-columns:1fr}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.back{display:block}}
</style></head>
<body>
<div id="auth" class="hide">
 <form id="af">
  <h1>💬 Chatter</h1>
  <input id="em" type="text" placeholder="Email" required autocomplete="username">
  <input id="pw" type="password" placeholder="Password" required minlength="6" autocomplete="current-password">
  <button id="ab">Log in</button>
  <div id="amsg"></div>
  <button type="button" class="ghost" id="fp">Forgot password?</button>
  <button type="button" class="ghost" id="sw">Create new account</button>
 </form>
 <div id="wiz" class="hide">
  <button type="button" class="ghost" id="wback">←</button>
  <h2 id="wt"></h2><p id="wp"></p>
  <div id="wbody" style="display:flex;flex-direction:column;gap:10px"></div>
  <div id="wmsg"></div>
  <button type="button" id="wnext">Next</button>
  <button type="button" class="ghost hide" id="walt"></button>
  <button type="button" class="ghost hide" id="wres"></button>
 </div>
</div>

<div class="app hide" id="app">
 <aside class="side">
  <h1 id="ptitle">Chatter</h1>
  <div class="sw" id="sqw"><input id="sq" style="width:100%" maxlength="30"></div>
  <div class="chips" id="chips">
   <button class="chip on" data-f="all">All</button><button class="chip" data-f="unread">Unread</button><button class="chip" data-f="global">Global</button><button class="chip" data-f="groups">Groups</button>
  </div>
  <div id="list"></div>
  <nav class="tabs" id="tabs">
   <button class="tab on" data-t="chats"><span>💬</span>Messages<i class="bd hide" id="b-chats"></i></button>
   <button class="tab" data-t="people"><span>👥</span>People</button>
   <button class="tab" data-t="notifs"><span>🔔</span>Notifications<i class="bd hide" id="b-notifs"></i></button>
   <button class="tab" data-t="menu"><span>☰</span>Menu</button>
  </nav>
 </aside>
 <section class="main">
  <div class="head"><button class="ghost back" id="back">‹</button><div class="hd"><div id="title">Select a chat</div><div class="sub" id="sub"></div></div></div>
  <div id="msgs"><div class="empty">Select a chat to get started.</div></div>
  <div class="typing" id="typing"></div>
  <div class="bar hide" id="eb"><span>✎ Editing message</span><button type="button" class="gray sm" id="ec">✕</button></div>
  <div class="bar hide" id="pv"></div>
  <form class="compose" id="f"><button type="button" class="gray att" id="att">📎</button><input type="file" id="file" accept="image/*" class="hide"><input id="in" placeholder="Type a message…" autocomplete="off" maxlength="1000"><button id="send">Send</button></form>
 </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== PUT YOUR SUPABASE KEYS HERE (Project Settings > API Keys) ======
const SUPABASE_URL = "https://ykyphsopgnhfdnvytswp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_lzh6KRFUa8tG2ObZcaDK4w_LJ_QUqUO";
// ==========================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = t => { const d = new Date(t), n = new Date(); return d.toDateString() === n.toDateString() ? d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : d.toLocaleDateString([], {month: "short", day: "numeric"}); };
const colorFor = id => { let h = 0; for (const c of id || "") h = (h * 31 + c.charCodeAt(0)) % 360; return "hsl(" + h + " 55% 45%)"; };
const avatar = (id, label, cls, pres) => { const a = el("div", "av " + (cls || ""), label); a.style.background = colorFor(id); if (pres && online.has(pres)) a.append(el("span", "odot")); return a; };
const pvText = l => l.deleted_at ? "Message unsent" : l.image_path ? "📷 " + (l.body || "Photo") : l.body;
let rd = {}; try { rd = JSON.parse(localStorage.getItem("rd") || "{}"); } catch (e) {}
const markRead = (rid, ts) => { rd[rid] = ts; try { localStorage.setItem("rd", JSON.stringify(rd)); } catch (e) {} };

let me, names = {}, rooms = [], members = {}, latest = {}, fr = [], online = new Set();
let tab = "chats", filter = "all", query = "", results = null, cur = null, seen = new Set(), lastUid = null, signup = false;

// ---------- AUTH ----------
function showAuth() {
  W.reset = false;
  $("#app").classList.add("hide"); $("#auth").classList.remove("hide");
  $("#af").classList.remove("hide"); $("#wiz").classList.add("hide");
}
$("#af").onsubmit = async e => {
  e.preventDefault();
  const msg = $("#amsg"); msg.textContent = "One moment…";
  const id = $("#em").value.trim();
  if (!/^\S+@\S+\.\S+$/.test(id)) return msg.textContent = "Enter a valid email address.";
  const {error} = await sb.auth.signInWithPassword({email: id, password: $("#pw").value});
  msg.textContent = error ? error.message : "";
};

// ---------- SIGN UP WIZARD (name > birthday > gender > email > password > 6-digit code) ----------
const STEPS = ["name", "bday", "gender", "contact", "pw", "otp"], RSTEPS = ["remail", "rcode", "rnew"];
const W = {step: 0, d: {first: "", last: "", bday: "", gender: "", email: "", pw: ""}, timer: null, reset: false, rEmail: ""};
const target = () => W.d.email;
const cred = () => ({email: W.d.email});
const wfield = (id, ph, type, val, x) => { const i = el("input"); i.id = id; i.placeholder = ph; i.type = type || "text"; i.value = val || ""; return Object.assign(i, x || {}); };
const wmsg = t => { $("#wmsg").textContent = t || ""; };
const wval = id => ($("#" + id) || {}).value || "";

function wShow(n) {
  W.step = n; const s = (W.reset ? RSTEPS : STEPS)[n], b = $("#wbody"); b.replaceChildren(); wmsg(); clearInterval(W.timer);
  $("#wres").classList.add("hide"); $("#walt").classList.add("hide"); $("#wnext").textContent = "Next"; $("#wnext").disabled = false;
  const head = (t, p) => { $("#wt").textContent = t; $("#wp").textContent = p; };
  if (s === "remail") {
    head("Reset your password", "Enter your account email. We'll send a 6-digit code.");
    b.append(wfield("w1", "Email", "email", W.rEmail, {autocomplete: "email"})); $("#wnext").textContent = "Send code";
  } else if (s === "rcode") {
    head("Enter the code", "We sent a 6-digit code to " + W.rEmail + ". It may take a minute. Check spam too.");
    const o = wfield("w1", "000000", "text", "", {maxLength: 8, inputMode: "numeric", autocomplete: "one-time-code"}); o.className = "otp";
    o.oninput = () => { o.value = o.value.replace(/\D/g, ""); };
    b.append(o); $("#wnext").textContent = "Confirm"; wCooldown(30);
  } else if (s === "rnew") {
    head("Create a new password", "Use at least 6 characters.");
    const p = wfield("w1", "New password", "password", "", {autocomplete: "new-password"});
    const l = el("label", "small", " Show password"), c = el("input"); c.type = "checkbox"; c.style.cssText = "width:auto;padding:0"; c.onchange = () => { p.type = c.checked ? "text" : "password"; };
    l.prepend(c); b.append(p, l); $("#wnext").textContent = "Save password";
  } else if (s === "name") {
    head("What's your name?", "Enter the name you use in real life.");
    b.append(wfield("w1", "First name", "text", W.d.first, {maxLength: 30, autocomplete: "given-name"}), wfield("w2", "Last name", "text", W.d.last, {maxLength: 30, autocomplete: "family-name"}));
  } else if (s === "bday") {
    head("What's your birthday?", "Choose your date of birth.");
    b.append(wfield("w1", "Birthday", "date", W.d.bday, {max: new Date().toISOString().slice(0, 10)}));
  } else if (s === "gender") {
    head("What's your gender?", "You can change who sees this later.");
    [["Female", "female"], ["Male", "male"], ["More options", "other"]].forEach(([t, v]) => {
      const l = el("label", "opt", t), r = el("input"); r.type = "radio"; r.name = "g"; r.value = v; r.checked = W.d.gender === v; l.append(r); b.append(l);
    });
  } else if (s === "contact") {
    head("What's your email?", "Enter the email where you can be contacted. We'll send a confirmation code here.");
    b.append(wfield("w1", "Email", "email", W.d.email, {autocomplete: "email"}));
  } else if (s === "pw") {
    head("Create a password", "Use at least 6 characters.");
    const p = wfield("w1", "Password", "password", W.d.pw, {autocomplete: "new-password"});
    const l = el("label", "small", " Show password"), c = el("input"); c.type = "checkbox"; c.style.cssText = "width:auto;padding:0"; c.onchange = () => { p.type = c.checked ? "text" : "password"; };
    l.prepend(c); b.append(p, l); $("#wnext").textContent = "Sign up";
  } else {
    head("Enter the confirmation code", "We sent a 6-digit code to " + target() + ". It may take a minute." + " Check spam too.");
    const o = wfield("w1", "000000", "text", "", {maxLength: 8, inputMode: "numeric", autocomplete: "one-time-code"}); o.className = "otp";
    o.oninput = () => { o.value = o.value.replace(/\D/g, ""); };
    b.append(o); $("#wnext").textContent = "Confirm"; wCooldown(30);
  }
  const f = $("#w1"); if (f && s !== "gender") f.focus();
}
function wCooldown(sec) {
  const r = $("#wres"); r.classList.remove("hide"); r.disabled = true;
  const tick = () => { r.textContent = sec > 0 ? "Resend code in " + sec + "s" : "Resend code"; r.disabled = sec > 0; if (sec-- <= 0) clearInterval(W.timer); };
  tick(); W.timer = setInterval(tick, 1000);
}
$("#wres").onclick = async () => {
  wmsg(); $("#wres").disabled = true;
  const {error} = W.reset ? await sb.auth.resetPasswordForEmail(W.rEmail) : await sb.auth.resend({type: "signup", ...cred()});
  if (error) { wmsg(error.message); $("#wres").disabled = false; return; }
  wmsg("A new code was sent."); wCooldown(60);
};
$("#fp").onclick = () => { W.reset = true; W.rEmail = $("#em").value.trim().toLowerCase(); $("#af").classList.add("hide"); $("#wiz").classList.remove("hide"); wShow(0); };
$("#sw").onclick = () => { W.reset = false; $("#af").classList.add("hide"); $("#wiz").classList.remove("hide"); wShow(0); };
$("#wback").onclick = () => { if (W.reset) { clearInterval(W.timer); if (W.step === 2) return sb.auth.signOut(); if (W.step === 0) return showAuth(); return wShow(W.step - 1); } if (W.step === 0) { clearInterval(W.timer); showAuth(); } else wShow(W.step - 1); };
$("#wiz").onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { e.preventDefault(); $("#wnext").click(); } };

async function resetNext() {
  const s = RSTEPS[W.step], btn = $("#wnext"); wmsg();
  if (s === "remail") {
    const m = wval("w1").trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(m)) return wmsg("Enter a valid email address.");
    btn.disabled = true; W.rEmail = m;
    const {error} = await sb.auth.resetPasswordForEmail(m);
    if (error) { btn.disabled = false; return wmsg(error.message); }
    return wShow(1);
  }
  if (s === "rcode") {
    const code = wval("w1").replace(/\D/g, ""); if (code.length < 6) return wmsg("Enter the 6-digit code.");
    btn.disabled = true;
    const {error} = await sb.auth.verifyOtp({email: W.rEmail, token: code, type: "recovery"});
    if (error) { btn.disabled = false; return wmsg(/expired|invalid/i.test(error.message) ? "That code is wrong or has expired. Try again or resend." : error.message); }
    return wShow(2);
  }
  const pw = wval("w1"); if (pw.length < 6) return wmsg("Password must be at least 6 characters.");
  btn.disabled = true;
  const {error} = await sb.auth.updateUser({password: pw});
  if (error) { btn.disabled = false; return wmsg(error.message); }
  W.reset = false;
  const {data} = await sb.auth.getSession(); if (data.session && !me) start(data.session.user);
}
$("#wnext").onclick = async () => {
  if (W.reset) return resetNext();
  const s = STEPS[W.step]; wmsg();
  if (s === "name") {
    const f = wval("w1").trim(), l = wval("w2").trim();
    if (!f || !l) return wmsg("Enter your first and last name.");
    W.d.first = f; W.d.last = l; return wShow(1);
  }
  if (s === "bday") {
    const b = wval("w1"); if (!b) return wmsg("Choose your date of birth.");
    const d = new Date(b), n = new Date(); let age = n.getFullYear() - d.getFullYear();
    if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) age--;
    if (age < 13) return wmsg("You must be at least 13 years old to sign up.");
    W.d.bday = b; return wShow(2);
  }
  if (s === "gender") {
    const g = document.querySelector("input[name=g]:checked"); if (!g) return wmsg("Select an option.");
    W.d.gender = g.value; return wShow(3);
  }
  if (s === "contact") {
    const v = wval("w1").trim();
    const m = v.toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(m)) return wmsg("Enter a valid email address."); W.d.email = m;
    return wShow(4);
  }
  const btn = $("#wnext"); btn.disabled = true;
  if (s === "pw") {
    const p = wval("w1"); if (p.length < 6) { btn.disabled = false; return wmsg("Password must be at least 6 characters."); }
    W.d.pw = p;
    const {data, error} = await sb.auth.signUp({...cred(), password: p, options: {data: {
      username: W.d.first + " " + W.d.last, first_name: W.d.first, last_name: W.d.last, birthday: W.d.bday, gender: W.d.gender}}});
    if (error) { btn.disabled = false; return wmsg(error.message); }
    if (data.user && data.user.identities && !data.user.identities.length) { btn.disabled = false; return wmsg("This email already has an account. Go back and log in."); }
    if (data.session) return;   // email confirmation is off: logged in right away
    return wShow(5);
  }
  const code = wval("w1").replace(/\D/g, "");
  if (code.length < 6) { btn.disabled = false; return wmsg("Enter the 6-digit code."); }
  const {error} = await sb.auth.verifyOtp({...cred(), token: code, type: "signup"});
  if (error) { btn.disabled = false; return wmsg(error.message.includes("expired") || error.message.includes("invalid") ? "That code is wrong or has expired. Try again or resend." : error.message); }
};
sb.auth.onAuthStateChange((ev, session) => {
  if (session && !me && !W.reset) start(session.user);
  if (!session) { me = null; sb.removeAllChannels(); cur = null; results = null; showAuth(); }
});

// ---------- DATA ----------
async function ensureNames(ids) {
  const need = [...new Set(ids)].filter(i => i && !names[i]); if (!need.length) return;
  const {data} = await sb.from("profiles").select("id,username").in("id", need);
  (data || []).forEach(p => names[p.id] = p.username);
  need.forEach(i => { if (!names[i]) names[i] = "Someone"; });
}
const rel = uid => {
  const f = fr.find(f => (f.requester === me.id && f.addressee === uid) || (f.requester === uid && f.addressee === me.id));
  return f ? {id: f.id, status: f.status, incoming: f.addressee === me.id} : null;
};
const other = r => (members[r.id] || []).find(u => u !== me.id);
const title = r => r.is_dm ? (names[other(r)] || "Chat") : r.name;
const hasUnread = r => { const l = latest[r.id]; return !!l && l.user_id !== me.id && (!rd[r.id] || l.created_at > rd[r.id]); };
const pin = r => (!r.is_dm && !r.is_group && r.name === "General") ? 1 : 0;
const stamp = r => Date.parse(latest[r.id] ? latest[r.id].created_at : r.created_at) || 0;

async function loadChats() {
  const [r, m, l] = await Promise.all([
    sb.from("rooms").select("*"), sb.from("room_members").select("*"),
    sb.from("messages").select("*").order("created_at", {ascending: false}).limit(300)]);
  rooms = r.data || []; members = {}; latest = {};
  (m.data || []).forEach(x => { (members[x.room_id] = members[x.room_id] || []).push(x.user_id); });
  (l.data || []).forEach(x => { if (!latest[x.room_id]) latest[x.room_id] = x; });
  await ensureNames([...(m.data || []).map(x => x.user_id), ...Object.values(latest).map(x => x.user_id)]);
  render();
}
async function loadFriends() {
  const {data} = await sb.from("friendships").select("*");
  fr = data || [];
  await ensureNames(fr.flatMap(f => [f.requester, f.addressee]));
  render();
}
async function start(user) {
  me = user;
  $("#auth").classList.add("hide"); $("#app").classList.remove("hide");
  await ensureNames([me.id]);
  await Promise.all([loadChats(), loadFriends()]);
  sb.channel("msgs").on("postgres_changes", {event: "INSERT", schema: "public", table: "messages"}, onMsg).on("postgres_changes", {event: "UPDATE", schema: "public", table: "messages"}, onMsgUpd).subscribe();
  joinPresence();
  sb.channel("rooms").on("postgres_changes", {event: "INSERT", schema: "public", table: "rooms"}, loadChats).subscribe();
  sb.channel("mem").on("postgres_changes", {event: "INSERT", schema: "public", table: "room_members", filter: "user_id=eq." + me.id}, loadChats).subscribe();
  sb.channel("friends").on("postgres_changes", {event: "*", schema: "public", table: "friendships"}, loadFriends).subscribe();
  setTab("chats");
  const g = rooms.find(r => !r.is_dm);
  if (g && innerWidth > 700) openRoom(g.id);
}
async function onMsg(p) {
  const m = p.new;
  if (!rooms.find(r => r.id === m.room_id)) return loadChats();
  latest[m.room_id] = m;
  await ensureNames([m.user_id]);
  if (m.room_id === cur) { addMsg(m, cur); markRead(cur, m.created_at); }
  render();
}

// ---------- UI: PANELS ----------
function setTab(t) {
  tab = t; results = null; query = ""; $("#sq").value = "";
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("#ptitle").textContent = {chats: "Chatter", people: "People", notifs: "Notifications", menu: "Menu"}[t];
  $("#sqw").classList.toggle("hide", t === "notifs" || t === "menu");
  $("#chips").classList.toggle("hide", t !== "chats");
  $("#sq").placeholder = t === "people" ? "Find an account (username)…" : "Search";
  render();
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.t));
document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b)); render();
});
let st;
$("#sq").oninput = e => {
  const q = e.target.value.trim().replace(/[%_\\,]/g, "");
  if (tab === "chats") { query = q.toLowerCase(); return render(); }
  clearTimeout(st);
  if (!q) { results = null; return render(); }
  st = setTimeout(async () => {
    const {data} = await sb.from("profiles").select("id,username").ilike("username", "%" + q + "%").neq("id", me.id).limit(20);
    results = data || []; results.forEach(p => names[p.id] = p.username); render();
  }, 250);
};

function userRow(box, uid) {
  const r = rel(uid), name = names[uid] || "Someone", btns = [];
  const btn = (txt, cls, fn) => { const b = el("button", "sm " + cls, txt); b.onclick = e => { e.stopPropagation(); fn(); }; return b; };
  if (!r) btns.push(btn("Add", "", async () => { const {error} = await sb.from("friendships").insert({addressee: uid}); if (error) alert(error.message); loadFriends(); }));
  else if (r.status === "pending" && !r.incoming) btns.push(btn("Pending ✕", "gray", async () => { await sb.from("friendships").delete().eq("id", r.id); loadFriends(); }));
  else if (r.status === "pending") {
    btns.push(btn("Accept", "", async () => { await sb.from("friendships").update({status: "accepted"}).eq("id", r.id); loadFriends(); }));
    btns.push(btn("✕", "gray", async () => { await sb.from("friendships").delete().eq("id", r.id); loadFriends(); }));
  } else btns.push(btn("Message", "gray", () => openDM(uid)));
  const d = el("div", "item"), mid = el("div", "mid"); mid.append(el("div", "t1", name));
  d.append(avatar(uid, name[0].toUpperCase(), "", r && r.status === "accepted" ? uid : null), mid, ...btns);
  d.onclick = () => { if (r && r.status === "accepted") openDM(uid); };
  box.append(d);
}

function render() {
  if (!me) return;
  const box = $("#list"); box.replaceChildren();
  const nUn = rooms.filter(hasUnread).length, nReq = fr.filter(f => f.status === "pending" && f.addressee === me.id).length;
  [["chats", nUn], ["notifs", nReq]].forEach(([k, n]) => { const b = $("#b-" + k); b.textContent = n; b.classList.toggle("hide", !n); });

  if (tab === "chats") {
    const rs = rooms.filter(r => (filter !== "global" || (!r.is_dm && !r.is_group)) && (filter !== "groups" || r.is_group) && (filter !== "unread" || hasUnread(r)) && title(r).toLowerCase().includes(query))
      .sort((a, b) => pin(b) - pin(a) || stamp(b) - stamp(a));
    if (!rs.length) box.append(el("div", "hint", filter === "unread" ? "No unread chats." : "No chats yet. Go to People to add a friend."));
    rs.forEach(r => {
      const l = latest[r.id], un = hasUnread(r), t = title(r);
      const d = el("div", "item" + (un ? " unread" : "") + (cur === r.id ? " on" : "")), mid = el("div", "mid");
      let pv = "Start a conversation";
      if (l) pv = (l.user_id === me.id ? "You: " : (r.is_dm ? "" : (names[l.user_id] || "") + ": ")) + pvText(l);
      mid.append(el("div", "t1", t), el("div", "t2", pv + (l ? " · " + fmt(l.created_at) : "")));
      d.append(avatar(r.id, r.is_dm ? t[0].toUpperCase() : (r.is_group ? "👥" : "🌐"), "", r.is_dm ? other(r) : null), mid);
      if (un) d.append(el("div", "dot"));
      d.onclick = () => openRoom(r.id); box.append(d);
    });
  } else if (tab === "people") {
    if (results) {
      box.append(el("div", "sec", "Results"));
      if (!results.length) box.append(el("div", "hint", "No accounts found."));
      results.forEach(p => userRow(box, p.id));
    } else {
      const fs = fr.filter(f => f.status === "accepted").map(f => f.requester === me.id ? f.addressee : f.requester);
      box.append(el("div", "sec", "Friends (" + fs.length + ")"));
      if (!fs.length) box.append(el("div", "hint", "No friends yet. Search a username above to add one."));
      fs.forEach(uid => userRow(box, uid));
    }
  } else if (tab === "notifs") {
    const inc = fr.filter(f => f.status === "pending" && f.addressee === me.id);
    box.append(el("div", "sec", "Friend requests"));
    if (!inc.length) box.append(el("div", "hint", "No new notifications."));
    inc.forEach(f => userRow(box, f.requester));
  } else {
    const m = el("div", "menu"), card = el("div", "item"), mid = el("div", "mid");
    card.style.padding = "0"; mid.append(el("div", "t1", names[me.id]), el("div", "t2", (me.email || me.phone || "")));
    card.append(avatar(me.id, (names[me.id] || "?")[0].toUpperCase()), mid);
    const gi = el("input"); gi.placeholder = "Group name…"; gi.maxLength = 40; gi.value = gdraft.name; gi.oninput = () => gdraft.name = gi.value;
    const fl = el("div", "pick"), fs = fr.filter(f => f.status === "accepted").map(f => f.requester === me.id ? f.addressee : f.requester);
    if (!fs.length) fl.append(el("div", "hint", "Add friends first to start a group."));
    fs.forEach(u => { const lb = el("label", "pk"), cb = el("input"); cb.type = "checkbox"; cb.checked = gdraft.sel.has(u); cb.onchange = () => cb.checked ? gdraft.sel.add(u) : gdraft.sel.delete(u); lb.append(cb, avatar(u, (names[u] || "?")[0].toUpperCase(), "sm"), el("span", null, names[u] || "Someone")); fl.append(lb); });
    const nb = el("button", "sm", "Create group"); nb.onclick = createGroup;
    const out = el("button", "gray", "Logout"); out.onclick = () => sb.auth.signOut();
    m.append(card, el("div", "sec", "Create a group (only the friends you pick can see it)"), gi, fl, nb, out);
    box.append(m);
  }
}

// ---------- CHAT ----------
async function openDM(uid) {
  const {data, error} = await sb.rpc("start_dm", {other: uid});
  if (error) return alert(error.message);
  if (!rooms.find(r => r.id === data)) await loadChats();
  setTab("chats"); openRoom(data);
}
async function openRoom(id) {
  cur = id; seen = new Set(); lastUid = null;
  const r = rooms.find(x => x.id === id); if (!r) return;
  $("#title").textContent = title(r); $("#app").classList.add("open");
  rows = {}; stopEdit(); setPend(null); joinTyping(id); updateHead();
  if (latest[id]) markRead(id, latest[id].created_at);
  render();
  const box = $("#msgs"); box.replaceChildren();
  const {data, error} = await sb.from("messages").select("*").eq("room_id", id).order("created_at", {ascending: false}).limit(200);
  if (cur !== id) return;
  if (error) { box.textContent = error.message; return; }
  if (!data.length) box.append(el("div", "empty", "No messages yet. Start the conversation!"));
  await ensureNames(data.map(m => m.user_id));
  data.reverse().forEach(m => addMsg(m, id));
  box.scrollTop = box.scrollHeight;
}
let rows = {}, editing = null, pend = null, busy = false, tch = null, typers = {}, tT = null, lastTyp = 0;
const urls = {}, uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
async function imgUrl(path) {
  const c = urls[path]; if (c && c.exp > Date.now()) return c.url;
  const {data, error} = await sb.storage.from("chat-images").createSignedUrl(path, 3600);
  if (error || !data) return null;
  urls[path] = {url: data.signedUrl, exp: Date.now() + 3000000}; return data.signedUrl;
}
function addMsg(m, forRoom) {
  if (seen.has(m.id) || cur !== forRoom) return; seen.add(m.id);
  const nm = names[m.user_id] || "Someone", box = $("#msgs"), e = box.querySelector(".empty"); if (e) e.remove();
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120, mine = m.user_id === me.id;
  const row = el("div", "row" + (mine ? " me" : ""));
  if (!mine) row.append(avatar(m.user_id, nm[0].toUpperCase(), "sm"));
  const col = el("div", "col"), r = rooms.find(x => x.id === cur);
  if (!mine && !(r && r.is_dm) && lastUid !== m.user_id) col.append(el("div", "nm", nm));
  const pic = el("div", "pic hide"), bub = el("div", "bub"), tm = el("div", "tm"), acts = el("div", "acts");
  if (mine) {
    const ed = el("button", "sm gray", "✎ Edit"), de = el("button", "sm gray", "🗑 Unsend"), more = el("button", "more", "⋯");
    ed.onclick = () => startEdit(rows[m.id].m); de.onclick = () => unsend(rows[m.id].m);
    more.onclick = () => row.classList.toggle("sel");
    acts.append(ed, de); row.append(more);
  }
  col.append(pic, bub, tm, acts); row.append(col); box.append(row);
  rows[m.id] = {m, row, pic, bub, tm, acts, near: near || mine};
  fill(m); lastUid = m.user_id;
  if (!mine) { delete typers[m.user_id]; showTyping(); }
  if (near || mine) box.scrollTop = box.scrollHeight;
}
function fill(m) {
  const o = rows[m.id]; if (!o) return; o.m = m;
  const gone = !!m.deleted_at, box = $("#msgs");
  o.pic.replaceChildren(); o.pic.classList.add("hide");
  if (gone) { o.bub.textContent = "Message unsent"; o.bub.classList.add("gone"); o.bub.classList.remove("hide"); }
  else {
    o.bub.classList.remove("gone"); o.bub.textContent = m.body || ""; o.bub.classList.toggle("hide", !m.body);
    if (m.image_path) {
      o.pic.classList.remove("hide");
      const im = el("img", "ld"); im.alt = "Photo";
      im.onload = () => { im.classList.remove("ld"); if (o.near) box.scrollTop = box.scrollHeight; };
      im.onerror = () => im.classList.remove("ld");
      im.onclick = () => { if (im.src) window.open(im.src, "_blank", "noopener"); };
      o.pic.append(im);
      imgUrl(m.image_path).then(u => { if (u) im.src = u; else o.pic.textContent = "Couldn't open image"; });
    }
  }
  o.tm.textContent = fmt(m.created_at) + (m.edited_at && !gone ? " · edited" : "");
  const mb = o.row.querySelector(".more");
  if (mb) { mb.classList.toggle("hide", gone); if (gone) o.row.classList.remove("sel"); }
}
function afterChange(m) { if (latest[m.room_id] && latest[m.room_id].id === m.id) latest[m.room_id] = m; fill(m); render(); }
function onMsgUpd(p) { if (p.new.room_id === cur || latest[p.new.room_id]) afterChange(p.new); }

// ---- edit / unsend ----
function startEdit(m) {
  editing = {m}; setPend(null);
  $("#eb").classList.remove("hide"); $("#att").classList.add("hide");
  if (rows[m.id]) rows[m.id].row.classList.remove("sel");
  const i = $("#in"); i.value = m.body || ""; i.focus();
}
function stopEdit() { if (!editing) return; editing = null; $("#in").value = ""; $("#eb").classList.add("hide"); $("#att").classList.remove("hide"); }
$("#ec").onclick = stopEdit;
async function saveEdit(body) {
  const m = editing.m;
  if (!body && !m.image_path) return alert("Message is empty. Use Unsend to delete it.");
  if (body === (m.body || "")) return stopEdit();
  const {data, error} = await sb.from("messages").update({body, edited_at: new Date().toISOString()}).eq("id", m.id).select().single();
  if (error) return alert("Couldn't edit: " + error.message);
  afterChange(data); stopEdit();
}
async function unsend(m) {
  if (!confirm("Unsend this message? It will disappear for everyone.")) return;
  const {data, error} = await sb.from("messages").update({deleted_at: new Date().toISOString(), body: "", image_path: null}).eq("id", m.id).select().single();
  if (error) return alert("Couldn't unsend: " + error.message);
  if (m.image_path) sb.storage.from("chat-images").remove([m.image_path]);
  if (editing && editing.m.id === m.id) stopEdit();
  afterChange(data);
}

// ---- images ----
$("#att").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (!f.type.startsWith("image/")) return alert("Images only.");
  if (f.size > 15 * 1024 * 1024) return alert("File too large (max 15 MB).");
  setPend(f);
};
function setPend(f) {
  if (pend) URL.revokeObjectURL(pend.url);
  pend = f ? {file: f, url: URL.createObjectURL(f)} : null;
  const b = $("#pv"); b.replaceChildren(); b.classList.toggle("hide", !pend);
  if (pend) { const im = el("img"), x = el("button", "gray sm", "✕"); im.src = pend.url; x.type = "button"; x.onclick = () => setPend(null); b.append(im, el("span", null, "Ready to send"), x); }
}
async function shrink(file) {
  const bmp = await createImageBitmap(file), sc = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error("Couldn't process the image")), "image/jpeg", 0.82));
}
$("#f").onsubmit = async e => {
  e.preventDefault();
  const i = $("#in"), body = i.value.trim(), rid = cur;
  if (editing) return saveEdit(body);
  if ((!body && !pend) || !rid || busy) return;
  if (!pend) {
    i.value = "";
    const {error} = await sb.from("messages").insert({room_id: rid, body});
    if (error) { i.value = body; alert("Couldn't send: " + error.message); }
    return;
  }
  busy = true; $("#send").disabled = true;
  try {
    const blob = await shrink(pend.file), path = me.id + "/" + uid() + ".jpg";
    const up = await sb.storage.from("chat-images").upload(path, blob, {contentType: "image/jpeg"});
    if (up.error) throw up.error;
    const {error} = await sb.from("messages").insert({room_id: rid, body, image_path: path});
    if (error) { sb.storage.from("chat-images").remove([path]); throw error; }
    i.value = ""; setPend(null);
  } catch (err) { alert("Couldn't send: " + (err.message || err)); }
  busy = false; $("#send").disabled = false;
};

// ---- typing + online ----
function joinTyping(id) {
  leaveTyping();
  tch = sb.channel("typing:" + id);
  tch.on("broadcast", {event: "typing"}, ({payload}) => {
    if (!payload || payload.uid === me.id) return;
    typers[payload.uid] = {name: payload.name || "Someone", until: Date.now() + 3500}; showTyping();
  }).subscribe();
}
function leaveTyping() { if (tch) { sb.removeChannel(tch); tch = null; } typers = {}; showTyping(); }
function showTyping() {
  clearTimeout(tT);
  const now = Date.now(), ns = [];
  for (const k in typers) { if (typers[k].until > now) ns.push(typers[k].name); else delete typers[k]; }
  $("#typing").textContent = !ns.length ? "" : ns.length === 1 ? ns[0] + " is typing…" : ns.join(", ") + " are typing…";
  if (ns.length) tT = setTimeout(showTyping, 1000);
}
$("#in").addEventListener("input", () => {
  const n = Date.now();
  if (editing || !tch || !$("#in").value || n - lastTyp < 2500) return;
  lastTyp = n; tch.send({type: "broadcast", event: "typing", payload: {uid: me.id, name: names[me.id]}});
});
function joinPresence() {
  const ch = sb.channel("online", {config: {presence: {key: me.id}}});
  ch.on("presence", {event: "sync"}, () => { online = new Set(Object.keys(ch.presenceState())); render(); updateHead(); })
    .subscribe(async s => { if (s === "SUBSCRIBED") await ch.track({at: new Date().toISOString()}); });
}
function updateHead() {
  const r = rooms.find(x => x.id === cur), s = $("#sub"), on = !!(r && r.is_dm && online.has(other(r)));
  s.textContent = on ? "● Online" : (r && r.is_group ? (members[r.id] || []).length + " members" : ""); s.className = "sub" + (on ? " on" : "");
}

const gdraft = {name: "", sel: new Set()};
async function createGroup() {
  const name = gdraft.name.trim();
  if (!name) return alert("Enter a group name.");
  if (!gdraft.sel.size) return alert("Pick at least one friend.");
  const {data, error} = await sb.rpc("create_group", {group_name: name, member_ids: [...gdraft.sel]});
  if (error) return alert(error.message);
  gdraft.name = ""; gdraft.sel = new Set();
  await loadChats(); setTab("chats"); openRoom(data);
}
$("#back").onclick = () => { $("#app").classList.remove("open"); cur = null; leaveTyping(); stopEdit(); updateHead(); render(); };
sb.auth.getSession().then(({data}) => { if (!data.session) showAuth(); });
</script>
</body></html>
